<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <radialGradient id="glowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
      <circle cx="40" cy="0" r="1.5" fill="#ffffff" fill-opacity="0.1" />
    </pattern>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs (Deep in background) -->
  <circle cx="240" cy="180" r="220" fill="url(#glowLeft)" filter="url(#blurFilter)">
    <animate attributeName="cx" values="220;260;220" dur="8s" repeatCount="indefinite" />
    <animate attributeName="cy" values="160;200;160" dur="8s" repeatCount="indefinite" />
  </circle>

  <circle cx="960" cy="240" r="260" fill="url(#glowRight)" filter="url(#blurFilter)">
    <animate attributeName="cx" values="980;940;980" dur="10s" repeatCount="indefinite" />
    <animate attributeName="cy" values="260;220;260" dur="10s" repeatCount="indefinite" />
  </circle>

  <!-- Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Decorative Modern Abstract Floating Grid Nodes (Background layer) -->
  <g opacity="0.4">
    <!-- Connecting flow lines -->
    <path d="M 80 210 Q 250 140 400 210 T 800 210 T 1120 210" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="20s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Dynamic Animated Design System Token Chips (Kept safely around edges) -->
  <g transform="translate(900, 45)">
    <rect width="170" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity="0.85" />
    <circle cx="18" cy="17" r="6" fill="#8b5cf6">
      <animate attributeName="fill" values="#8b5cf6;#ec4899;#3b82f6;#8b5cf6" dur="6s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="22" fill="#cbd5e1" font-size="12" font-weight="600" letter-spacing="0.5">design-tokens.json</text>
  </g>

  <g transform="translate(130, 45)">
    <rect width="150" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity="0.85" />
    <circle cx="18" cy="17" r="6" fill="#10b981" />
    <text x="34" y="22" fill="#cbd5e1" font-size="12" font-weight="600" letter-spacing="0.5">W3C DTCG Ready</text>
  </g>

  <g transform="translate(1000, 345)">
    <rect width="120" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity="0.85" />
    <circle cx="16" cy="16" r="5" fill="#06b6d4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="21" fill="#94a3b8" font-size="12" font-weight="500">Live Tokens</text>
  </g>

  <g transform="translate(80, 345)">
    <rect width="135" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.2" opacity="0.85" />
    <circle cx="16" cy="16" r="5" fill="#f59e0b" />
    <text x="30" y="21" fill="#94a3b8" font-size="12" font-weight="500">Brand Systems</text>
  </g>

  <!-- FOREGROUND: Content Card & Central Title -->
  <!-- Top Category Tag -->
  <g transform="translate(460, 85)">
    <rect width="280" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <text x="140" y="21" text-anchor="middle" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing="1.5">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="165" text-anchor="middle" fill="#ffffff" font-size="44" font-weight="800" letter-spacing="-0.5">
    Brand Style Guides &amp; Design Systems
  </text>

  <!-- Accent Gradient Bar Underneath Title -->
  <rect x="420" y="185" width="360" height="4" rx="2" fill="url(#primaryGrad)">
    <animate attributeName="width" values="320;380;320" dur="4s" repeatCount="indefinite" />
    <animate attributeName="x" values="440;410;440" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- Subtitle Line 1 -->
  <text x="600" y="228" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="500">
    Top SaaS Platforms • Open-Source Frameworks • Design Token Pipelines
  </text>

  <!-- Subtitle Line 2 / Tagline -->
  <text x="600" y="260" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="400">
    Bridging Brand Guidelines, UI Component Libraries, and Multi-Platform Engineering
  </text>

  <!-- Bottom Feature Badges (Pills) -->
  <g transform="translate(290, 295)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="30" rx="15" fill="#182234" stroke="#334155" stroke-width="1"/>
    <text x="65" y="19" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="600">🎨 Brand Portals</text>

    <!-- Pill 2 -->
    <rect x="145" y="0" width="155" height="30" rx="15" fill="#182234" stroke="#334155" stroke-width="1"/>
    <text x="222" y="19" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="600">💎 Design Tokens</text>

    <!-- Pill 3 -->
    <rect x="315" y="0" width="150" height="30" rx="15" fill="#182234" stroke="#334155" stroke-width="1"/>
    <text x="390" y="19" text-anchor="middle" fill="#f472b6" font-size="12" font-weight="600">📦 Component Kits</text>

    <!-- Pill 4 -->
    <rect x="480" y="0" width="140" height="30" rx="15" fill="#182234" stroke="#334155" stroke-width="1"/>
    <text x="550" y="19" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">🚀 Open-Source</text>
  </g>
</svg>
